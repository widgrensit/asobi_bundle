name: Docker publish

# Publishes ghcr.io/widgrensit/asobi - a ready-to-run node: the game backend,
# the Lua runtime, the operator console AND every first-party extension
# (asobi_quests, asobi_seasons, ...) in one image.
#
# This image used to be published from widgrensit/asobi, back when "everything
# asobi ships" and "asobi" were the same application list. Since the first
# extraction (asobi_seasons) they diverge: asobi is the kernel, the bundle is
# the batteries. Building the image from here - where the release closure is
# asobi + every extension - is what stops an extracted subsystem silently
# vanishing from the image on upgrade. The asobi repo no longer publishes an
# image (its docker-publish.yml is retired); assemblers who want a bare kernel
# build their own release from the asobi dependency.
#
# The image name is hard-coded to ghcr.io/widgrensit/asobi (NOT
# ghcr.io/${{ github.repository }}, which would be asobi_bundle) so existing
# compose files and pins keep working across the relocation - the asobi_lua
# source-less-image precedent.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/widgrensit/asobi
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # {{major}} is "0" on a 0.x line. It is a weak pin on 0.x, where
            # minors are not compatible; guides/self-hosting.md tells readers to
            # pin the minor or a digest. Emitting it keeps the major tag moving
            # forward rather than stranded on an old image.
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
